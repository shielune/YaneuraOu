# subline windows build
name: Make CI (MinGW for Windows)

on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:

jobs:
  build-mingw:
    # ubuntu-latest = ubuntu-22.04
    # https://docs.github.com/ja/actions/using-github-hosted-runners/about-github-hosted-runners
    # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-Readme.md
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # このフォークが配布している構成に揃えている (WASM 側の
        # build-wasm.yml と同じ 6 エディション)。upstream の KPPT /
        # KPP_KKPT / MATERIAL / TANUKI_MATE / USER_ENGINE は配布物に
        # 含めていないので、ここでもビルドしない。
        edition:
          - YANEURAOU_ENGINE_NNUE_KP256
          - YANEURAOU_ENGINE_NNUE_HALFKP_128X2_32_32
          - YANEURAOU_ENGINE_NNUE
          - YANEURAOU_ENGINE_NNUE_HALFKP_768X2_16_64
          - YANEURAOU_ENGINE_SFNN_halfkahm2_1024_15_64_progress8ek
          - YANEURAOU_MATE_ENGINE
        compiler:
          - x86_64-w64-mingw32-g++-posix
          # - i686-w64-mingw32-g++-posix
        target:
          - tournament
        # 配布は 64bit のみ。上から順に新しい CPU 向けで、AVX2 が
        # 「とりあえずこれ」の既定。SSE42 は AVX 非対応機向けの保険。
        archcpu:
          - AVX512VNNI
          - AVXVNNI
          - AVX512
          - AVX2
          - SSE42
          - ZEN2
          - ZEN3
        # 32bit (i686) は配布しないので、それ向けの除外は不要になった。
        # AVXVNNI (-march=alderlake) は ubuntu-22.04 の MinGW では通らない。

    steps:
      - name: Checkout own repository
        uses: actions/checkout@v7
        with:
          path: main

      - name: install mingw
        run: |
          sudo cat /etc/apt/sources.list
          sudo ls -R /etc/apt/sources.list.d
          sudo apt update
          sudo apt install build-essential mingw-w64

      - name: make
        # SFNN 系は make 中に nnue_arch_gen.py でアーキヘッダを生成するが、
        # Makefile の既定は PYTHON=python で、ubuntu には python3 しか無い。
        run: ./main/script/mingw_gcc.sh -e ${{ matrix.edition }} -c ${{ matrix.compiler }} -t ${{ matrix.target }} -a ${{ matrix.archcpu }} -x "PYTHON=python3"

      - uses: actions/upload-artifact@v7
        with:
          name: build-mingw_${{ github.run_number }}_${{ matrix.edition }}_${{ matrix.compiler }}_${{ matrix.target }}_${{ matrix.archcpu }}_${{ github.sha }}
          path: ./main/build/**/*

  release-mingw:
    needs: build-mingw
    if: startsWith(github.ref, 'refs/tags/win-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/win-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          pattern: build-mingw_*
          path: download/

      # The matrix produces one artifact per (edition, archcpu) pair, each
      # holding a single .exe. Ship one zip per edition instead, so a user
      # picks their engine and gets every CPU target in it.
      - name: Repack one zip per edition
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p stage dist
          find download -name '*.exe' -print0 | while IFS= read -r -d '' exe; do
            base="$(basename "$exe")"
            # <FileStr>-windows-<compiler>-<target>-<archcpu>.exe
            edition="${base%%-windows-*}"
            mkdir -p "stage/${edition}"
            cp "$exe" "stage/${edition}/"
          done
          for d in stage/*/; do
            edition="$(basename "$d")"
            (cd "$d" && zip -q -r "../../dist/${edition}-windows-v${VERSION}.zip" .)
          done
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "YaneuraOu Windows ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu shogi engine — Windows builds (MinGW, 64-bit).

            One zip per engine, each containing every CPU target:
            `AVX512VNNI`, `AVXVNNI`, `AVX512`, `AVX2`, `SSE42`, `ZEN2`, `ZEN3`.

            **Pick a build**: `AVX2` runs on any Haswell-or-later Intel and most
            AMD. Use `SSE42` on older machines, `ZEN2`/`ZEN3` on Ryzen, and the
            `AVX512*` ones only on CPUs that actually have AVX-512 — they will
            not start otherwise.

            NNUE engines need an eval file (`nn.bin`); see the WASM release
            notes for where each network is published.
          files: dist/*.zip
