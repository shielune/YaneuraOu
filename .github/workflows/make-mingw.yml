# subline windows build
name: Make CI (MinGW for Windows)

on:
  workflow_dispatch:
#  push:
#    branches:
#      - "**"
#  pull_request:
#    branches:
#      - "**"

jobs:
  build-mingw:
    # ubuntu-latest = ubuntu-22.04
    # https://docs.github.com/ja/actions/using-github-hosted-runners/about-github-hosted-runners
    # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-Readme.md
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # このフォークが配布している構成に揃えている (WASM 側の
        # build-wasm.yml と同じ 6 エディション)。upstream の KPPT /
        # KPP_KKPT / MATERIAL / TANUKI_MATE / USER_ENGINE は配布物に
        # 含めていないので、ここでもビルドしない。
        edition:
          - YANEURAOU_ENGINE_NNUE_KP256
          - YANEURAOU_ENGINE_NNUE_HALFKP_128X2_32_32
          - YANEURAOU_ENGINE_NNUE
          - YANEURAOU_ENGINE_NNUE_HALFKP_768X2_16_64
          - YANEURAOU_ENGINE_SFNN_halfkahm2_1024_15_64_progress8ek
          - YANEURAOU_MATE_ENGINE
        compiler:
          - x86_64-w64-mingw32-g++-posix
          # - i686-w64-mingw32-g++-posix
        target:
          - tournament
        # 配布は 64bit のみ。上から順に新しい CPU 向けで、AVX2 が
        # 「とりあえずこれ」の既定。SSE42 は AVX 非対応機向けの保険。
        archcpu:
          - AVX512VNNI
          - AVX512
          - AVX2
          - SSE42
          - ZEN2
          - ZEN3
        # 32bit (i686) は配布しないので、それ向けの除外は不要になった。
        # AVXVNNI (-march=alderlake) は ubuntu-22.04 の MinGW では通らない。

    steps:
      - name: Checkout own repository
        uses: actions/checkout@v7
        with:
          path: main

      - name: install mingw
        run: |
          sudo cat /etc/apt/sources.list
          sudo ls -R /etc/apt/sources.list.d
          sudo apt update
          sudo apt install build-essential mingw-w64

      - name: make
        # SFNN 系は make 中に nnue_arch_gen.py でアーキヘッダを生成するが、
        # Makefile の既定は PYTHON=python で、ubuntu には python3 しか無い。
        run: ./main/script/mingw_gcc.sh -e ${{ matrix.edition }} -c ${{ matrix.compiler }} -t ${{ matrix.target }} -a ${{ matrix.archcpu }} -x "PYTHON=python3"

      - uses: actions/upload-artifact@v7
        with:
          name: build-mingw_${{ github.run_number }}_${{ matrix.edition }}_${{ matrix.compiler }}_${{ matrix.target }}_${{ matrix.archcpu }}_${{ github.sha }}
          path: ./main/build/**/*
