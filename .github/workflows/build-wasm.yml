name: Build wasm

on:
  push:
    tags:
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "emscripten/emsdk Docker tag"
        required: false
        default: "5.0.5"

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: kp256-cfworkers
            dir: yaneuraou-wasm-kp256-cfworkers
            edition: YANEURAOU_ENGINE_NNUE_KP256
            export_name: YaneuraOu_K_P
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
          - name: mate-cfworkers
            dir: yaneuraou-wasm-mate-cfworkers
            edition: YANEURAOU_MATE_ENGINE
            export_name: YaneuraOu_MATE
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
          - name: pthread-kp256
            dir: yaneuraou-wasm-pthread-kp256
            edition: YANEURAOU_ENGINE_NNUE_KP256
            export_name: YaneuraOu_K_P
            environment: web,worker
            pthread: 1
            initial_memory: 134217728
            maximum_memory: 1073741824
          - name: mate-pthread
            dir: yaneuraou-wasm-mate-pthread
            edition: YANEURAOU_MATE_ENGINE
            export_name: YaneuraOu_MATE
            environment: web,worker
            pthread: 1
            initial_memory: 134217728
            maximum_memory: 1073741824
          - name: pthread-halfkp256
            dir: yaneuraou-wasm-pthread-halfkp256
            edition: YANEURAOU_ENGINE_NNUE
            export_name: YaneuraOu_HalfKP256
            environment: web,worker
            pthread: 1
            initial_memory: 268435456
            maximum_memory: 2147483648
          - name: pthread-halfkp768
            dir: yaneuraou-wasm-pthread-halfkp768
            edition: YANEURAOU_ENGINE_NNUE_HALFKP_768X2_16_64
            export_name: YaneuraOu_HalfKP768
            environment: web,worker
            pthread: 1
            initial_memory: 268435456
            maximum_memory: 2147483648
          - name: material-cfworkers
            dir: yaneuraou-wasm-material-cfworkers
            edition: YANEURAOU_ENGINE_MATERIAL
            export_name: YaneuraOu_Material
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
            # 駒得のみ評価 (Lv1)。eval は同梱不要 (handcrafted)。
            extra_make_args: "MATERIAL_LEVEL=1"
          - name: mobility-cfworkers
            dir: yaneuraou-wasm-mobility-cfworkers
            edition: YANEURAOU_ENGINE_KIKI
            export_name: YaneuraOu_Mobility
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
            # Mobility (KIKI) 評価関数。重みは mobility_weights_embedded.cpp に焼き込み済み。
            extra_make_args: ""

          # HumanLike SkillLevel (hlsl) variants — humanlike personality USI options
          # (ForceCaptureProb / StableKingProb / *BlindProb 等) を有効化したビルド。
          # 各 OFF 版と同じ edition / memory / export name で、USE_HUMANLIKE_OPTIONS=ON
          # を make に渡すだけの差分。
          - name: kp256-cfworkers-hlsl
            dir: yaneuraou-wasm-kp256-cfworkers-hlsl
            edition: YANEURAOU_ENGINE_NNUE_KP256
            export_name: YaneuraOu_K_P
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
            extra_make_args: "USE_HUMANLIKE_OPTIONS=ON"
          - name: pthread-kp256-hlsl
            dir: yaneuraou-wasm-pthread-kp256-hlsl
            edition: YANEURAOU_ENGINE_NNUE_KP256
            export_name: YaneuraOu_K_P
            environment: web,worker
            pthread: 1
            initial_memory: 134217728
            maximum_memory: 1073741824
            extra_make_args: "USE_HUMANLIKE_OPTIONS=ON"
          - name: pthread-halfkp256-hlsl
            dir: yaneuraou-wasm-pthread-halfkp256-hlsl
            edition: YANEURAOU_ENGINE_NNUE
            export_name: YaneuraOu_HalfKP256
            environment: web,worker
            pthread: 1
            initial_memory: 268435456
            maximum_memory: 2147483648
            extra_make_args: "USE_HUMANLIKE_OPTIONS=ON"
          - name: pthread-halfkp768-hlsl
            dir: yaneuraou-wasm-pthread-halfkp768-hlsl
            edition: YANEURAOU_ENGINE_NNUE_HALFKP_768X2_16_64
            export_name: YaneuraOu_HalfKP768
            environment: web,worker
            pthread: 1
            initial_memory: 268435456
            maximum_memory: 2147483648
            extra_make_args: "USE_HUMANLIKE_OPTIONS=ON"
          - name: material-cfworkers-hlsl
            dir: yaneuraou-wasm-material-cfworkers-hlsl
            edition: YANEURAOU_ENGINE_MATERIAL
            export_name: YaneuraOu_Material
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
            extra_make_args: "MATERIAL_LEVEL=1 USE_HUMANLIKE_OPTIONS=ON"
          - name: mobility-cfworkers-hlsl
            dir: yaneuraou-wasm-mobility-cfworkers-hlsl
            edition: YANEURAOU_ENGINE_KIKI
            export_name: YaneuraOu_Mobility
            environment: web
            pthread: 0
            initial_memory: 67108864
            maximum_memory: 134217728
            extra_make_args: "USE_HUMANLIKE_OPTIONS=ON"

          # Node.js variants — built with EM_ENVIRONMENT=node and
          # EXPORTED_RUNTIME_METHODS including 'callMain' so the loader can
          # drive USI manually after a noInitialRun bootstrap. Pinned to
          # emscripten 3.1.43, the only toolchain currently confirmed to
          # drive a multi-threaded YaneuraOu correctly under Node — see
          # docs/wasm_client_usage.md for the compatibility matrix.
          - name: node-kp256
            dir: yaneuraou-wasm-node-kp256
            edition: YANEURAOU_ENGINE_NNUE_KP256
            export_name: YaneuraOu_K_P
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 134217728
            maximum_memory: 1073741824
          - name: node-mate
            dir: yaneuraou-wasm-node-mate
            edition: YANEURAOU_MATE_ENGINE
            export_name: YaneuraOu_MATE
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 134217728
            maximum_memory: 1073741824
          - name: node-halfkp256
            dir: yaneuraou-wasm-node-halfkp256
            edition: YANEURAOU_ENGINE_NNUE
            export_name: YaneuraOu_HalfKP256
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 268435456
            maximum_memory: 2147483648
          - name: node-halfkp768
            dir: yaneuraou-wasm-node-halfkp768
            edition: YANEURAOU_ENGINE_NNUE_HALFKP_768X2_16_64
            export_name: YaneuraOu_HalfKP768
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 268435456
            maximum_memory: 2147483648
          - name: node-material
            dir: yaneuraou-wasm-node-material
            edition: YANEURAOU_ENGINE_MATERIAL
            export_name: YaneuraOu_Material
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 134217728
            maximum_memory: 1073741824
            extra_make_args: "MATERIAL_LEVEL=1"
          - name: node-mobility
            dir: yaneuraou-wasm-node-mobility
            edition: YANEURAOU_ENGINE_KIKI
            export_name: YaneuraOu_Mobility
            environment: node
            pthread: 1
            exported_runtime_methods: "['FS','ccall','callMain']"
            emsdk_version: "3.1.43"
            initial_memory: 134217728
            maximum_memory: 1073741824

    steps:
      - uses: actions/checkout@v4

      - name: docker pull
        run: |
          # Per-matrix override > workflow_dispatch input > default.
          # Node variants pin themselves to 3.1.43 via the matrix.
          EMSDK_VERSION="${{ matrix.package.emsdk_version || inputs.emsdk_version || '5.0.5' }}"
          sudo docker pull "emscripten/emsdk:${EMSDK_VERSION}"

      - name: build wasm (${{ matrix.package.name }})
        run: |
          EMSDK_VERSION="${{ matrix.package.emsdk_version || inputs.emsdk_version || '5.0.5' }}"
          # Node variants need 'callMain' in EXPORTED_RUNTIME_METHODS so the
          # loader can trigger main() after a noInitialRun bootstrap. Browser
          # and cfworkers variants keep the original ['FS','ccall'] default.
          EXPORTED_RUNTIME_METHODS="${{ matrix.package.exported_runtime_methods || '[''FS'',''ccall'']' }}"
          DIST_DIR="${{ matrix.package.dir }}/dist"
          mkdir -p "$DIST_DIR"

          sudo docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/source \
            "emscripten/emsdk:${EMSDK_VERSION}" \
            make -j$(nproc) clean tournament \
              COMPILER=em++ \
              TARGET_CPU=WASM \
              YANEURAOU_EDITION=${{ matrix.package.edition }} \
              TARGET="../${DIST_DIR}/yaneuraou.js" \
              EM_EXPORT_NAME=${{ matrix.package.export_name }} \
              EM_ENVIRONMENT=${{ matrix.package.environment }} \
              "EM_EXPORTED_RUNTIME_METHODS=${EXPORTED_RUNTIME_METHODS}" \
              EM_PTHREAD=${{ matrix.package.pthread }} \
              EM_INITIAL_MEMORY_SIZE=${{ matrix.package.initial_memory }} \
              EM_MAXIMUM_MEMORY_SIZE=${{ matrix.package.maximum_memory }} \
              EM_STACK_SIZE=2097152 \
              EM_CLOSURE=0 \
              ${{ matrix.package.extra_make_args }}

      - name: verify and compress
        run: |
          cd ${{ matrix.package.dir }}/dist
          ls -lh yaneuraou.js yaneuraou.wasm
          for f in yaneuraou.js yaneuraou.wasm; do
            brotli -f --best "$f" -o "${f}.br" || true
            gzip  -f --best -k "$f" || true
          done
          # emscripten 3.1.43 also emits a classic pthread worker script
          # next to the engine js. Compress it the same way for symmetry
          # so consumers can serve it gzip/brotli-encoded if they want.
          if [ -f yaneuraou.worker.js ]; then
            brotli -f --best yaneuraou.worker.js -o yaneuraou.worker.js.br || true
            gzip  -f --best -k yaneuraou.worker.js || true
          fi
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package.dir }}-dist
          path: ${{ matrix.package.dir }}/dist/

  release-wasm:
    needs: build-wasm
    if: startsWith(github.ref, 'refs/tags/wasm-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/wasm-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download all WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yaneuraou-wasm-*-dist
          path: download/

      - name: Stage each package + compile loader + create tar.gz
        run: |
          for d in \
            yaneuraou-wasm-kp256-cfworkers \
            yaneuraou-wasm-mate-cfworkers \
            yaneuraou-wasm-pthread-kp256 \
            yaneuraou-wasm-mate-pthread \
            yaneuraou-wasm-pthread-halfkp256 \
            yaneuraou-wasm-pthread-halfkp768 \
            yaneuraou-wasm-material-cfworkers \
            yaneuraou-wasm-mobility-cfworkers \
            yaneuraou-wasm-kp256-cfworkers-hlsl \
            yaneuraou-wasm-pthread-kp256-hlsl \
            yaneuraou-wasm-pthread-halfkp256-hlsl \
            yaneuraou-wasm-pthread-halfkp768-hlsl \
            yaneuraou-wasm-material-cfworkers-hlsl \
            yaneuraou-wasm-mobility-cfworkers-hlsl \
            yaneuraou-wasm-node-kp256 \
            yaneuraou-wasm-node-mate \
            yaneuraou-wasm-node-halfkp256 \
            yaneuraou-wasm-node-halfkp768 \
            yaneuraou-wasm-node-material \
            yaneuraou-wasm-node-mobility \
          ; do
            mkdir -p "$d/dist"
            cp -R "download/${d}-dist/." "$d/dist/"
            (cd "$d" && bun install --frozen-lockfile --ignore-scripts && bun tsc)
            bun -e "
              const pkg = require('./$d/package.json');
              pkg.version = '${{ steps.version.outputs.version }}';
              require('fs').writeFileSync('$d/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            # Node variants ship the 3.1.43 classic pthread worker script
            # (emscripten loads it via locateFile at runtime) AND the
            # worker_shim compiled from src/worker_shim.ts (the loader
            # routes .worker.js through it to bridge node:worker_threads
            # back to a faked web-worker scope).
            extra=""
            case "$d" in
              yaneuraou-wasm-node-*)
                extra="$d/dist/yaneuraou.worker.js $d/dist/worker_shim.js $d/dist/worker_shim.d.ts"
                ;;
            esac
            tar czf "${d}-v${{ steps.version.outputs.version }}.tar.gz" \
              "$d/package.json" \
              "$d/README.md" \
              "$d/SPEC.md" \
              "$d/dist/index.js" \
              "$d/dist/index.d.ts" \
              "$d/dist/yaneuraou.js" \
              "$d/dist/yaneuraou.wasm" \
              "$d/dist/yaneuraou.wasm.br" \
              $extra
          done
          ls -lh *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-wasm ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu shogi engine — WebAssembly builds.

            **What's new in this release**: 6 brand-new **Node.js-targeted** packages (`@ultemica/yaneuraou-wasm-node-*`) join the existing 14. Total: **20 npm-shaped packages**, each shipped as its own `tar.gz` asset on this page.

            - `kp256` / `mate` / `halfkp256` / `halfkp768` / `material` / `mobility`, all multi-threaded via `node:worker_threads`.
            - Built with **emscripten 3.1.43** — the only toolchain currently verified to drive a pthread-backed YaneuraOu cleanly under Node (newer emscriptens stall, see `docs/wasm_client_usage.md` for the matrix).
            - Drop-in `createEngine()` loader: zero boilerplate on the consumer side. The package wraps the `node:worker_threads` plumbing, `Worker` polyfill, web-globals shim, and `noInitialRun` + `callMain` bootstrap internally.
            - Verified locally on Node 26 with KP256 + suishopetite — depth 24 in ~3.4 s @ threads=1 (≈0.84 M nps), ~6.8 s @ threads=4 (≈3.32 M nps, ~4× linear scale).

            ---

            Each archive contains the package's `package.json` (version bumped to this release), `README.md`, `SPEC.md`, the TypeScript loader (`dist/index.js`, `dist/index.d.ts`), and the engine bundle (`dist/yaneuraou.js`, `dist/yaneuraou.wasm`, `.wasm.br`). Node variants additionally ship `dist/yaneuraou.worker.js` (the emscripten 3.1.43 classic pthread worker) and `dist/worker_shim.{js,d.ts}` (the `worker_threads`-side glue the loader uses to bridge `.worker.js` into a fake web-worker scope).

            ## Packages

            ### Default (humanlike OFF)

            | Package | Engine | Eval data | Threading | Initial / Max memory | Target |
            |---|---|---|---|---|---|
            | `@ultemica/yaneuraou-wasm-kp256-cfworkers` | NNUE KP256 (Suishopetite) | external (~873 KB) | single-thread | 64 MB / 128 MB | Cloudflare Workers, edge runtimes |
            | `@ultemica/yaneuraou-wasm-mate-cfworkers` | Mate (DfPn) | none | single-thread | 64 MB / 128 MB | Cloudflare Workers, edge runtimes |
            | `@ultemica/yaneuraou-wasm-material-cfworkers` | Material Lv1 (handcrafted) | **embedded** | single-thread | 64 MB / 128 MB | Cloudflare Workers, edge runtimes |
            | `@ultemica/yaneuraou-wasm-mobility-cfworkers` | Mobility / KIKI (164-dim learned linear) | **embedded** | single-thread | 64 MB / 128 MB | Cloudflare Workers, edge runtimes |
            | `@ultemica/yaneuraou-wasm-pthread-kp256` | NNUE KP256 (Suishopetite) | external (~873 KB) | pthread | 128 MB / 1 GB | Browser (COOP/COEP required) |
            | `@ultemica/yaneuraou-wasm-mate-pthread` | Mate (DfPn) | none | pthread | 128 MB / 1 GB | Browser (COOP/COEP required) |
            | `@ultemica/yaneuraou-wasm-pthread-halfkp256` | NNUE HalfKP_256x2_32_32 (Suisho5) | external (~62 MB) | pthread | 256 MB / 2 GB | Browser (COOP/COEP required) |
            | `@ultemica/yaneuraou-wasm-pthread-halfkp768` | NNUE HalfKP_768x2_16_64 (AobaNNUE) | external (数十 MB) | pthread | 256 MB / 2 GB | Browser (COOP/COEP required) |

            ### HumanLike SkillLevel (hlsl) variants

            Same six engine-bearing variants above (NNUE 4 + Material + Mobility) but built with `USE_HUMANLIKE_OPTIONS=ON`, exposing the humanlike personality USI options (`ForceCaptureProb`, `StableKingProb`, `*BlindProb`, etc.) for skill-level tuning / personality emulation.

            | Package | Notes |
            |---|---|
            | `@ultemica/yaneuraou-wasm-kp256-cfworkers-hlsl` | KP256 cfworkers + humanlike |
            | `@ultemica/yaneuraou-wasm-material-cfworkers-hlsl` | Material Lv1 cfworkers + humanlike |
            | `@ultemica/yaneuraou-wasm-mobility-cfworkers-hlsl` | Mobility cfworkers + humanlike |
            | `@ultemica/yaneuraou-wasm-pthread-kp256-hlsl` | KP256 pthread + humanlike |
            | `@ultemica/yaneuraou-wasm-pthread-halfkp256-hlsl` | HalfKP256 pthread + humanlike |
            | `@ultemica/yaneuraou-wasm-pthread-halfkp768-hlsl` | HalfKP768 pthread + humanlike |

            > Mate engine variants are not provided in -hlsl form because humanlike options are search-time personality filters and have no effect on the DfPn mate solver.

            > Cloudflare Workers cannot host pthread builds — use the cfworkers variant there. HalfKP cfworkers variant does not exist (eval exceeds Workers memory budget). Material / Mobility variants ship an embedded evaluator and need no external weights.

            ### Node.js variants ✨ new in this release

            Six packages built with `EM_ENVIRONMENT=node`, `EM_PTHREAD=1`, and `EM_EXPORTED_RUNTIME_METHODS=['FS','ccall','callMain']`. Pinned to **emscripten 3.1.43** — the only toolchain currently verified to drive a multi-threaded YaneuraOu correctly under Node (3.1.44–3.1.73 stall on ESM workers, 3.1.74+ stall on `INCOMING_MODULE_JS_API`; both unresolved). See `docs/wasm_client_usage.md` for the full compatibility matrix.

            | Package | Engine | Eval data | Threading | Initial / Max memory |
            |---|---|---|---|---|
            | `@ultemica/yaneuraou-wasm-node-kp256` | NNUE KP256 (Suishopetite) | external (~873 KB) | pthread | 128 MB / 1 GB |
            | `@ultemica/yaneuraou-wasm-node-mate` | Mate (DfPn) | none | pthread | 128 MB / 1 GB |
            | `@ultemica/yaneuraou-wasm-node-material` | Material Lv1 (handcrafted) | **embedded** | pthread | 128 MB / 1 GB |
            | `@ultemica/yaneuraou-wasm-node-mobility` | Mobility / KIKI (164-dim learned linear) | **embedded** | pthread | 128 MB / 1 GB |
            | `@ultemica/yaneuraou-wasm-node-halfkp256` | NNUE HalfKP_256x2_32_32 (Suisho5) | external (~62 MB) | pthread | 256 MB / 2 GB |
            | `@ultemica/yaneuraou-wasm-node-halfkp768` | NNUE HalfKP_768x2_16_64 (AobaNNUE) | external (数十 MB) | pthread | 256 MB / 2 GB |

            **Quickstart (Node 18+):**

            ```ts
            import fs from "node:fs/promises";
            import { createRequire } from "node:module";
            import { createEngine } from "@ultemica/yaneuraou-wasm-node-kp256";
            import YaneuraOuFactory from "@ultemica/yaneuraou-wasm-node-kp256/engine";

            const require = createRequire(import.meta.url);
            const wasmPath   = require.resolve("@ultemica/yaneuraou-wasm-node-kp256/wasm");
            const enginePath = require.resolve("@ultemica/yaneuraou-wasm-node-kp256/engine");
            const wasmBinary = await fs.readFile(wasmPath);
            const evalBin    = await fs.readFile("./eval/nn.bin"); // suishopetite for KP256

            const engine = await createEngine({
              factory: YaneuraOuFactory,
              enginePath,
              wasmBinary,
              evalBin,
              threads: 4,
              usiHash: 64,
            });

            const result = await engine.eval({
              sfen: "lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1",
              byoyomi: 2_000,
            });
            console.log(result.bestmove, result.score); // -> "7g7f", { kind: "cp", value: ... }
            engine.dispose();
            ```

            > Requires **Node.js 18 or later**. Browsers cannot load these binaries (built with `EM_ENVIRONMENT=node`, not `web,worker`); use the `pthread-*` packages there. Cloudflare Workers / V8 Isolate environments can't host pthread builds at all; use the `*-cfworkers` packages there. Node variants are not shipped in `-hlsl` form in this release.

            ## Required: NNUE eval file (NNUE builds only)

            WASM bundle には評価関数を内蔵していないので、別途 nn.bin を取得して `FS.writeFile` で MEMFS に書いて `EvalDir` USI option で読み込ませる。

            | Eval | Engine | Size | URL |
            |---|---|---|---|
            | suisho5 nn.bin | HalfKP_256x2_32_32 | ~62 MB | https://github.com/mizar/YaneuraOu/releases/download/resource/suisho5_20211123.halfkp.nnue.cpp.gz |
            | AobaNNUE nn.bin | HalfKP_768x2_16_64 | 数十 MB | https://github.com/yssaya/AobaNNUE/releases |
            | suishopetite nn.bin | KP256 | ~873 KB | https://github.com/mizar/YaneuraOu/releases/download/resource/suishopetite_20211123.k_p.nnue.cpp.gz |

            > suisho5 / suishopetite は embedded C++ array 形式の `.cpp.gz`。`script/eval_bin_to_cpp_literal.py` の逆変換で `.bin` に戻す。AobaNNUE は素の `nn.bin` がそのまま配布されている。

            > KP256 / HalfKP_256x2_32_32 / HalfKP_768x2_16_64 の eval はそれぞれ互換性なし。Mate engine は eval 不要。HalfKP eval (62 MB) は cfworkers の 128 MB heap で OOM になるため pthread variant でのみ使える。

            ## Optional: opening book

            `BookDir` / `BookFile` USI option で読み込ませる。

            | Book | 局面数 | Size | URL |
            |---|---|---|---|
            | 100T-shock | ~40,000 | 4.7 MB | https://github.com/yaneurao/YaneuraOu/releases/download/BOOK-100T-Shock/100T-shock-book.zip |
            | 700T-shock | ~400,000 | 32 MB | https://github.com/yaneurao/YaneuraOu/releases/download/BOOK-700T-Shock/700T-shock-book.zip |
            | 新ペタショック 233万 | ~2,330,000 | 76 MB (.7z) | https://github.com/yaneurao/YaneuraOu/releases/download/new_petabook233/new_petabook_20250505c.7z |

            > 700T-shock (32 MB) は cfworkers の 128 MB heap だと OOM。cfworkers で book を使う場合は 100T-shock まで。petabook は pthread variant でも heap 圧迫するので注意。
