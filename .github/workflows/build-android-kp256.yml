name: Build android-kp256 .so

on:
  push:
    tags:
      - "android-kp256-v*"
    branches:
      - feature/native-ffi-release
  workflow_dispatch:

jobs:
  build-android-kp256:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate or install Android NDK
        run: |
          NDK_PATH=""
          for p in /opt/hostedtoolcache/ndk/r26d/x64 \
                   /usr/local/lib/android/sdk/ndk/26.* \
                   /usr/local/lib/android/sdk/ndk/25.*; do
            [ -d "$p" ] && NDK_PATH="$p" && break
          done
          if [ -z "$NDK_PATH" ]; then
            cd /tmp
            curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q ndk.zip
            NDK_PATH=/tmp/android-ndk-r26d
          fi
          echo "Using NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$NDK_PATH" >> "$GITHUB_PATH"

      - name: ndk-build (NNUE KP256, arm64-v8a)
        run: |
          cd jni
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android-ffi.mk \
            NDK_APPLICATION_MK=./Application-ffi.mk \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE_KP256 \
            -j2

      - name: List produced library
        run: ls -la jni/libs/arm64-v8a/

      - uses: actions/upload-artifact@v4
        with:
          name: libyaneuraou-kp256-android-arm64-v8a
          path: jni/libs/arm64-v8a/libyaneuraou-kp256.so

  release-android-kp256:
    needs: build-android-kp256
    if: startsWith(github.ref, 'refs/tags/android-kp256-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/android-kp256-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-kp256-android-arm64-v8a
          path: jni/libs/arm64-v8a/

      - name: Create release archive
        run: |
          tar czf "yaneuraou-android-kp256-v${{ steps.version.outputs.version }}.tar.gz" \
            -C jni/libs arm64-v8a/libyaneuraou-kp256.so

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-android-kp256 ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu NNUE KP256 Android shared library (.so).

            - `YANEURAOU_ENGINE_NNUE_KP256` (~1 MB eval), Android NDK r26d, API 24+
            - ABI: arm64-v8a only
            - Linked against `c++_static` STL, `-fPIC`, exception/RTTI disabled
            - Driven via the FFI C ABI (`yaneuraou_init` / `_set_recv` / `_send` / `_shutdown` — see `source/yaneuraou_ffi.h`)

            ## Required: NNUE eval file (KP256)

            The `.so` does NOT bundle the eval. Pass it at runtime via the `EvalDir` USI option.

            | File | Architecture | Size |
            |---|---|---|
            | suishopetite nn.bin | KP256 | ~873 KB |

            > HalfKP256 eval (~62 MB) is not compatible — use `yaneuraou-android-halfkp` instead.
          files: |
            yaneuraou-android-kp256-v${{ steps.version.outputs.version }}.tar.gz
