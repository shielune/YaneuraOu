name: Build wasm-pthread-kp256 WASM package

on:
  push:
    tags:
      - "wasm-pthread-kp256-v*"
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "emscripten/emsdk Docker tag"
        required: false
        default: "5.0.5"

jobs:
  build-wasm-pthread-kp256:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker pull
        run: |
          docker pull emscripten/emsdk:${{ inputs.emsdk_version || '5.0.5' }}

      - name: build wasm (NNUE_KP256, pthread)
        run: |
          EMSDK_VERSION="${{ inputs.emsdk_version || '5.0.5' }}"
          DIST_DIR="yaneuraou-wasm-pthread-kp256/dist"
          mkdir -p "$DIST_DIR"

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/source \
            "emscripten/emsdk:${EMSDK_VERSION}" \
            make -j$(nproc) clean tournament \
              COMPILER=em++ \
              TARGET_CPU=WASM \
              YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE_KP256 \
              TARGET="../${DIST_DIR}/yaneuraou.js" \
              EM_EXPORT_NAME=YaneuraOu_K_P \
              EM_ENVIRONMENT=web,worker \
              "EM_EXPORTED_RUNTIME_METHODS=['FS','ccall']" \
              EM_PTHREAD=1 \
              EM_INITIAL_MEMORY_SIZE=134217728 \
              EM_MAXIMUM_MEMORY_SIZE=1073741824 \
              EM_STACK_SIZE=2097152 \
              EM_CLOSURE=0

      - name: verify artifacts
        run: |
          ls -lh yaneuraou-wasm-pthread-kp256/dist/

      - name: compress
        run: |
          cd yaneuraou-wasm-pthread-kp256/dist
          for f in yaneuraou.js yaneuraou.wasm; do
            brotli -f --best "$f" -o "${f}.br" || true
            gzip  -f --best -k "$f" || true
          done
          echo "--- compressed ---"
          ls -lh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-wasm-pthread-kp256-dist
          path: yaneuraou-wasm-pthread-kp256/dist/

  release-wasm-pthread-kp256:
    needs: build-wasm-pthread-kp256
    if: startsWith(github.ref, 'refs/tags/wasm-pthread-kp256-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/wasm-pthread-kp256-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: yaneuraou-wasm-pthread-kp256-dist
          path: yaneuraou-wasm-pthread-kp256/dist/

      - name: Compile TypeScript loader
        working-directory: yaneuraou-wasm-pthread-kp256
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun tsc

      - name: Update package.json version
        working-directory: yaneuraou-wasm-pthread-kp256
        run: |
          bun -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Create release archive
        run: |
          cd yaneuraou-wasm-pthread-kp256
          tar czf "../yaneuraou-wasm-pthread-kp256-v${{ steps.version.outputs.version }}.tar.gz" \
            package.json \
            README.md \
            SPEC.md \
            dist/index.js \
            dist/index.d.ts \
            dist/yaneuraou.js \
            dist/yaneuraou.wasm \
            dist/yaneuraou.wasm.br

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-wasm-pthread-kp256 ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu NNUE KP256 WASM, multi-threaded build for browsers.

            - `YANEURAOU_ENGINE_NNUE_KP256` / `EM_PTHREAD=1` / SIMD enabled
            - Memory: 128 MB initial, 1 GB max
            - **Requires `SharedArrayBuffer` and COOP/COEP cross-origin isolation headers**
            - Cloudflare Workers is not supported — use `@ultemica/yaneuraou-wasm-cfworkers`

            ```ts
            import { createEngine } from "@ultemica/yaneuraou-wasm-pthread-kp256";
            ```

            ## Required: NNUE eval file

            This package does NOT include the eval file. Download separately and pass via `evalBin`.

            | File | Architecture | Size |
            |---|---|---|
            | suishopetite nn.bin | KP256 | 873 KB |

            > HalfKP eval (62 MB) is not compatible with KP256.

            ## Optional: opening book

            | Book | Size |
            |---|---|
            | 100T-shock | 4.7 MB |
            | 700T-shock | 32 MB (fits comfortably under the 1 GB heap) |
          files: |
            yaneuraou-wasm-pthread-kp256-v${{ steps.version.outputs.version }}.tar.gz
