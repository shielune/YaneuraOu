name: Build mate-pthread WASM package

on:
  push:
    tags:
      - "mate-pthread-v*"
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "emscripten/emsdk Docker tag"
        required: false
        default: "5.0.5"

jobs:
  build-mate-pthread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker pull
        run: |
          docker pull emscripten/emsdk:${{ inputs.emsdk_version || '5.0.5' }}

      - name: build wasm (yaneuraou-mate, pthread)
        run: |
          EMSDK_VERSION="${{ inputs.emsdk_version || '5.0.5' }}"
          DIST_DIR="yaneuraou-mate-pthread/dist"
          mkdir -p "$DIST_DIR"

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/source \
            "emscripten/emsdk:${EMSDK_VERSION}" \
            make -j$(nproc) clean tournament \
              COMPILER=em++ \
              TARGET_CPU=WASM \
              YANEURAOU_EDITION=YANEURAOU_MATE_ENGINE \
              TARGET="../${DIST_DIR}/yaneuraou.js" \
              EM_EXPORT_NAME=YaneuraOu_MATE \
              EM_ENVIRONMENT=web,worker \
              "EM_EXPORTED_RUNTIME_METHODS=['FS','ccall','HEAPU8']" \
              EM_PTHREAD=1 \
              EM_INITIAL_MEMORY_SIZE=134217728 \
              EM_MAXIMUM_MEMORY_SIZE=1073741824 \
              EM_STACK_SIZE=2097152 \
              EM_CLOSURE=0

      - name: verify artifacts
        run: |
          ls -lh yaneuraou-mate-pthread/dist/

      - name: compress
        run: |
          cd yaneuraou-mate-pthread/dist
          for f in yaneuraou.js yaneuraou.wasm; do
            brotli -f --best "$f" -o "${f}.br" || true
            gzip  -f --best -k "$f" || true
          done
          echo "--- compressed ---"
          ls -lh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-mate-pthread-dist
          path: yaneuraou-mate-pthread/dist/

  release-mate-pthread:
    needs: build-mate-pthread
    if: startsWith(github.ref, 'refs/tags/mate-pthread-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/mate-pthread-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: yaneuraou-mate-pthread-dist
          path: yaneuraou-mate-pthread/dist/

      - name: Compile TypeScript loader
        working-directory: yaneuraou-mate-pthread
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun tsc

      - name: Update package.json version
        working-directory: yaneuraou-mate-pthread
        run: |
          bun -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Create release archive
        run: |
          cd yaneuraou-mate-pthread
          tar czf "../yaneuraou-mate-pthread-v${{ steps.version.outputs.version }}.tar.gz" \
            package.json \
            README.md \
            SPEC.md \
            dist/index.js \
            dist/index.d.ts \
            dist/yaneuraou.js \
            dist/yaneuraou.wasm \
            dist/yaneuraou.wasm.br

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-mate-pthread ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu mate (tsume) solver WASM, multi-threaded build for browsers.

            - `YANEURAOU_MATE_ENGINE` (DfPn) / `EM_PTHREAD=1` / SIMD enabled
            - Memory: 128 MB initial, 1 GB max
            - **Requires `SharedArrayBuffer` and COOP/COEP cross-origin isolation headers**
            - Cloudflare Workers is not supported — use `@ultemica/yaneuraou-mate-cfworkers`

            ```ts
            import { createMateEngine } from "@ultemica/yaneuraou-mate-pthread";
            ```

            ## Caveats

            - DfPn search is not parallelised; `threads > 1` does not speed it up.
              The extra worker only keeps the JS main thread responsive.
            - DfPn returns *a* forced mate, not always the shortest one. For
              shortest-mate guarantees, run iterative deepening above this engine.
          files: |
            yaneuraou-mate-pthread-v${{ steps.version.outputs.version }}.tar.gz
