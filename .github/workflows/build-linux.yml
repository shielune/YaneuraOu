name: Build linux

on:
  push:
    tags:
      - "linux-v*"
    branches:
      - feature/native-ffi-release-combined
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine:
          - { edition: YANEURAOU_ENGINE_KIKI,    name: Mobility }
          - { edition: YANEURAOU_ENGINE_MATERIAL, name: Material }
        arch:
          - { cpu: AVX2,      cc: g++,                   suffix: amd64   }
          - { cpu: GRAVITON2, cc: aarch64-linux-gnu-g++, suffix: aarch64 }

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler (aarch64 only)
        if: matrix.arch.suffix == 'aarch64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Build ${{ matrix.engine.name }}-${{ matrix.arch.suffix }}
        run: |
          make -C source -j$(nproc) normal \
            YANEURAOU_EDITION=${{ matrix.engine.edition }} \
            TARGET_CPU=${{ matrix.arch.cpu }} \
            COMPILER=${{ matrix.arch.cc }} \
            USE_HUMANLIKE_OPTIONS=OFF \
            TARGET=../build/${{ matrix.engine.name }}-${{ matrix.arch.suffix }}

      - name: List produced binary
        run: ls -lh build/${{ matrix.engine.name }}-${{ matrix.arch.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine.name }}-${{ matrix.arch.suffix }}
          path: build/${{ matrix.engine.name }}-${{ matrix.arch.suffix }}

  release-linux:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/linux-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: download/

      - name: Stage release tree
        run: |
          mkdir -p stage
          for name in Mobility Material; do
            for suffix in amd64 aarch64; do
              src="download/${name}-${suffix}/${name}-${suffix}"
              dst="stage/${name}-${suffix}"
              cp "$src" "$dst"
              chmod +x "$dst"
            done
          done
          ls -lh stage/

      - name: Create archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar czf "yaneuraou-linux-v${VERSION}.tar.gz" -C stage .
          ls -lh *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-linux ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu shogi engine — Linux native binaries.

            ## Contents

            | ファイル | エンジン | アーキテクチャ |
            |---|---|---|
            | `Mobility-amd64`   | Mobility 評価 | x86_64 AVX2 |
            | `Mobility-aarch64` | Mobility 評価 | ARM64 (Graviton2 相当) |
            | `Material-amd64`   | Material 評価 | x86_64 AVX2 |
            | `Material-aarch64` | Material 評価 | ARM64 (Graviton2 相当) |

            ## 外部重みファイルの使い方

            USI オプションでパスを指定してください。省略時はビルド時埋め込みの重みを使用します。

            ```
            setoption name MobilityWeightsFile value /path/to/eval/mobility/weights.bin
            setoption name MaterialWeightsFile value /path/to/eval/material/weights.bin
            ```

            重みファイルは [`weights-v*` リリース](../../releases?q=weights-v) からダウンロードできます。
          files: |
            yaneuraou-linux-v${{ steps.version.outputs.version }}.tar.gz
