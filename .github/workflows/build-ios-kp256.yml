name: Build ios-kp256 .a / xcframework

on:
  push:
    tags:
      - "ios-kp256-v*"
    branches:
      - feature/native-ffi-release
  workflow_dispatch:

jobs:
  build-ios-kp256-slice:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        slice:
          - sdk: iphoneos
            target: arm64-apple-ios14.0
            min_flag: -mios-version-min=14.0
            name: ios-arm64
          - sdk: iphonesimulator
            target: arm64-apple-ios14.0-simulator
            min_flag: -mios-simulator-version-min=14.0
            name: iossim-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build static library (KP256, ${{ matrix.slice.name }})
        run: |
          cd source
          SDK_PATH=$(xcrun --sdk ${{ matrix.slice.sdk }} --show-sdk-path)
          echo "Using SDK: $SDK_PATH"
          make -j$(sysctl -n hw.ncpu) \
            COMPILER=clang++ \
            TARGET_CPU=APPLEIOS_ARM64 \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE_KP256 \
            EXTRA_CPPFLAGS="-target ${{ matrix.slice.target }} -isysroot $SDK_PATH -arch arm64 ${{ matrix.slice.min_flag }}" \
            EXTRA_LDFLAGS="-target ${{ matrix.slice.target }} -isysroot $SDK_PATH -arch arm64" \
            ffi-static
          mv libyaneuraou.a libyaneuraou-kp256-${{ matrix.slice.name }}.a
          ls -lh libyaneuraou-kp256-${{ matrix.slice.name }}.a
          lipo -info libyaneuraou-kp256-${{ matrix.slice.name }}.a

      - uses: actions/upload-artifact@v4
        with:
          name: libyaneuraou-kp256-${{ matrix.slice.name }}
          path: source/libyaneuraou-kp256-${{ matrix.slice.name }}.a

  assemble-ios-kp256-xcframework:
    needs: build-ios-kp256-slice
    runs-on: macos-latest

    steps:
      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-kp256-ios-arm64
          path: ios-arm64/

      - name: Download simulator slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-kp256-iossim-arm64
          path: iossim-arm64/

      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -library ios-arm64/libyaneuraou-kp256-ios-arm64.a \
            -library iossim-arm64/libyaneuraou-kp256-iossim-arm64.a \
            -output yaneuraou-kp256.xcframework
          ls -la yaneuraou-kp256.xcframework/
          cat yaneuraou-kp256.xcframework/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-kp256-xcframework
          path: yaneuraou-kp256.xcframework/**

  release-ios-kp256:
    needs: assemble-ios-kp256-xcframework
    if: startsWith(github.ref, 'refs/tags/ios-kp256-v')
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/ios-kp256-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-kp256-ios-arm64
          path: ios-arm64/

      - name: Download simulator slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-kp256-iossim-arm64
          path: iossim-arm64/

      - name: Download xcframework
        uses: actions/download-artifact@v4
        with:
          name: yaneuraou-kp256-xcframework
          path: yaneuraou-kp256.xcframework/

      - name: Create release archive
        run: |
          tar czf "yaneuraou-ios-kp256-v${{ steps.version.outputs.version }}.tar.gz" \
            ios-arm64/libyaneuraou-kp256-ios-arm64.a \
            iossim-arm64/libyaneuraou-kp256-iossim-arm64.a \
            yaneuraou-kp256.xcframework

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-ios-kp256 ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu NNUE KP256 iOS static library + xcframework.

            - `YANEURAOU_ENGINE_NNUE_KP256` (~1 MB eval), Xcode 16 / iOS 14.0+
            - Slices: `arm64-apple-ios14.0` (device) + `arm64-apple-ios14.0-simulator` (Apple Silicon Mac)
            - Linked against libc++, `-fPIC`, exception/RTTI disabled
            - Driven via the FFI C ABI (`yaneuraou_init` / `_set_recv` / `_send` / `_shutdown` — see `source/yaneuraou_ffi.h`)

            ## Contents

            - `ios-arm64/libyaneuraou-kp256-ios-arm64.a` — device slice
            - `iossim-arm64/libyaneuraou-kp256-iossim-arm64.a` — simulator slice
            - `yaneuraou-kp256.xcframework/` — combined, ready to drag into Xcode

            ## Required: NNUE eval file (KP256)

            The library does NOT bundle the eval. Bundle the eval file (~873 KB) into your app and pass its path via the `EvalDir` USI option.

            > HalfKP256 eval (~62 MB) is not compatible — use `yaneuraou-ios-halfkp` instead.
          files: |
            yaneuraou-ios-kp256-v${{ steps.version.outputs.version }}.tar.gz
