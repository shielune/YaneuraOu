name: Build ios-mate .a / xcframework

on:
  push:
    tags:
      - "ios-mate-v*"
    branches:
      - feature/native-ffi-release
  workflow_dispatch:

jobs:
  build-ios-mate-slice:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        slice:
          - sdk: iphoneos
            target: arm64-apple-ios14.0
            min_flag: -mios-version-min=14.0
            name: ios-arm64
          - sdk: iphonesimulator
            target: arm64-apple-ios14.0-simulator
            min_flag: -mios-simulator-version-min=14.0
            name: iossim-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build static library (Mate, ${{ matrix.slice.name }})
        run: |
          cd source
          SDK_PATH=$(xcrun --sdk ${{ matrix.slice.sdk }} --show-sdk-path)
          echo "Using SDK: $SDK_PATH"
          make -j$(sysctl -n hw.ncpu) \
            COMPILER=clang++ \
            TARGET_CPU=APPLEIOS_ARM64 \
            YANEURAOU_EDITION=YANEURAOU_MATE_ENGINE \
            EXTRA_CPPFLAGS="-target ${{ matrix.slice.target }} -isysroot $SDK_PATH -arch arm64 ${{ matrix.slice.min_flag }}" \
            EXTRA_LDFLAGS="-target ${{ matrix.slice.target }} -isysroot $SDK_PATH -arch arm64" \
            ffi-static
          mv libyaneuraou.a libyaneuraou-mate-${{ matrix.slice.name }}.a
          ls -lh libyaneuraou-mate-${{ matrix.slice.name }}.a
          lipo -info libyaneuraou-mate-${{ matrix.slice.name }}.a

      - uses: actions/upload-artifact@v4
        with:
          name: libyaneuraou-mate-${{ matrix.slice.name }}
          path: source/libyaneuraou-mate-${{ matrix.slice.name }}.a

  assemble-ios-mate-xcframework:
    needs: build-ios-mate-slice
    runs-on: macos-latest

    steps:
      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-mate-ios-arm64
          path: ios-arm64/

      - name: Download simulator slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-mate-iossim-arm64
          path: iossim-arm64/

      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -library ios-arm64/libyaneuraou-mate-ios-arm64.a \
            -library iossim-arm64/libyaneuraou-mate-iossim-arm64.a \
            -output yaneuraou-mate.xcframework
          ls -la yaneuraou-mate.xcframework/
          cat yaneuraou-mate.xcframework/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-mate-xcframework
          path: yaneuraou-mate.xcframework/**

  release-ios-mate:
    needs: assemble-ios-mate-xcframework
    if: startsWith(github.ref, 'refs/tags/ios-mate-v')
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/ios-mate-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-mate-ios-arm64
          path: ios-arm64/

      - name: Download simulator slice
        uses: actions/download-artifact@v4
        with:
          name: libyaneuraou-mate-iossim-arm64
          path: iossim-arm64/

      - name: Download xcframework
        uses: actions/download-artifact@v4
        with:
          name: yaneuraou-mate-xcframework
          path: yaneuraou-mate.xcframework/

      - name: Create release archive
        run: |
          tar czf "yaneuraou-ios-mate-v${{ steps.version.outputs.version }}.tar.gz" \
            ios-arm64/libyaneuraou-mate-ios-arm64.a \
            iossim-arm64/libyaneuraou-mate-iossim-arm64.a \
            yaneuraou-mate.xcframework

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-ios-mate ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu Mate Solver iOS static library + xcframework.

            - `YANEURAOU_MATE_ENGINE` (詰将棋専用、評価関数なし)、Xcode 16 / iOS 14.0+
            - Slices: `arm64-apple-ios14.0` (device) + `arm64-apple-ios14.0-simulator` (Apple Silicon Mac)
            - Linked against libc++, `-fPIC`, exception/RTTI disabled
            - Driven via the FFI C ABI (`yaneuraou_init` / `_set_recv` / `_send` / `_shutdown` — see `source/yaneuraou_ffi.h`)

            ## Contents

            - `ios-arm64/libyaneuraou-mate-ios-arm64.a` — device slice
            - `iossim-arm64/libyaneuraou-mate-iossim-arm64.a` — simulator slice
            - `yaneuraou-mate.xcframework/` — combined, ready to drag into Xcode

            ## No eval / book file required

            Mate engine は詰探索専用で評価関数ファイルが不要。`isready` 後すぐ `go mate` で詰み手順を返す。
          files: |
            yaneuraou-ios-mate-v${{ steps.version.outputs.version }}.tar.gz
