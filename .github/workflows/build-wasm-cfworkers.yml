name: Build wasm-cfworkers WASM package

on:
  push:
    tags:
      - "wasm-cfworkers-v*"
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "emscripten/emsdk Docker tag"
        required: false
        default: "5.0.5"

jobs:
  build-wasm-cfworkers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker pull
        run: |
          docker pull emscripten/emsdk:${{ inputs.emsdk_version || '5.0.5' }}

      - name: build wasm (k-p.noeval, edge variant)
        run: |
          EMSDK_VERSION="${{ inputs.emsdk_version || '5.0.5' }}"
          DIST_DIR="yaneuraou-wasm-cfworkers/dist"
          mkdir -p "$DIST_DIR"

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/source \
            "emscripten/emsdk:${EMSDK_VERSION}" \
            make -j$(nproc) clean tournament \
              COMPILER=em++ \
              TARGET_CPU=WASM \
              YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE_KP256 \
              TARGET="../${DIST_DIR}/yaneuraou.js" \
              EM_EXPORT_NAME=YaneuraOu_K_P \
              EM_ENVIRONMENT=web \
              "EM_EXPORTED_RUNTIME_METHODS=['FS','ccall']" \
              EM_PTHREAD=0 \
              EM_INITIAL_MEMORY_SIZE=67108864 \
              EM_MAXIMUM_MEMORY_SIZE=134217728 \
              EM_STACK_SIZE=2097152 \
              EM_CLOSURE=0

      - name: verify artifacts
        run: |
          ls -lh yaneuraou-wasm-cfworkers/dist/yaneuraou.{js,wasm}

      - name: compress
        run: |
          cd yaneuraou-wasm-cfworkers/dist
          for f in yaneuraou.js yaneuraou.wasm; do
            brotli -f --best "$f" -o "${f}.br" || true
            gzip  -f --best -k "$f" || true
          done
          echo "--- compressed ---"
          ls -lh yaneuraou.*

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-wasm-cfworkers-dist
          path: yaneuraou-wasm-cfworkers/dist/

  release-wasm-cfworkers:
    needs: build-wasm-cfworkers
    if: startsWith(github.ref, 'refs/tags/wasm-cfworkers-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/wasm-cfworkers-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: yaneuraou-wasm-cfworkers-dist
          path: yaneuraou-wasm-cfworkers/dist/

      - name: Compile TypeScript loader
        working-directory: yaneuraou-wasm-cfworkers
        run: |
          npm install --ignore-scripts
          npx tsc

      - name: Update package.json version
        run: |
          cd yaneuraou-wasm-cfworkers
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Create release archive
        run: |
          cd yaneuraou-wasm-cfworkers
          tar czf "../yaneuraou-wasm-cfworkers-v${{ steps.version.outputs.version }}.tar.gz" \
            package.json \
            README.md \
            SPEC.md \
            dist/index.js \
            dist/index.d.ts \
            dist/yaneuraou.js \
            dist/yaneuraou.wasm \
            dist/yaneuraou.wasm.br

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yaneuraou-wasm-cfworkers ${{ steps.version.outputs.version }}"
          body: |
            YaneuraOu WASM for Cloudflare Workers (k-p.noeval, edge variant)

            - NNUE K-P256 / single-thread / SIMD enabled
            - Memory: 64MB initial, 128MB max
            - Eval / book files are NOT embedded -- load via `FS.writeFile` at runtime

            ```ts
            import { createEngine } from "@ultemica/yaneuraou-wasm-cfworkers";
            ```

            ## Required: NNUE eval file

            This package does NOT include the eval file. Download separately and serve via Static Assets or R2.

            | File | Architecture | Size | URL |
            |---|---|---|---|
            | suishopetite nn.bin | KP256 | 873KB | Included in [suishopetite_20211123.k_p.nnue.cpp.gz](https://github.com/mizar/YaneuraOu/releases/download/resource/suishopetite_20211123.k_p.nnue.cpp.gz) (embedded format, extract with build tools) |

            > HalfKP eval (62MB) is NOT compatible -- exceeds the 128MB WASM memory limit.

            ## Optional: opening book

            | Book | Positions | Size | URL |
            |---|---|---|---|
            | 100T-shock | ~40,000 | 4.7MB | [100T-shock-book.zip](https://github.com/yaneurao/YaneuraOu/releases/download/BOOK-100T-Shock/100T-shock-book.zip) |
            | 700T-shock | ~400,000 | 32MB | [700T-shock-book.zip](https://github.com/yaneurao/YaneuraOu/releases/download/BOOK-700T-Shock/700T-shock-book.zip) |

            > 700T-shock (32MB) causes OOM on Workers (128MB limit). Use 100T-shock for Workers.
          files: |
            yaneuraou-wasm-cfworkers-v${{ steps.version.outputs.version }}.tar.gz
