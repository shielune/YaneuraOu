<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>yaneuraou-mate-pthread test</title>
  </head>
  <body>
    <h1>yaneuraou-mate-pthread test</h1>
    <pre id="log"></pre>
    <script type="module">
      import YaneuraOuFactory from "/dist/yaneuraou.js";
      import { createMateEngine } from "/dist/index.js";

      const log = (msg) => {
        document.getElementById("log").textContent += msg + "\n";
        console.log(msg);
      };

      log(`crossOriginIsolated=${self.crossOriginIsolated}`);
      log(`SharedArrayBuffer=${typeof SharedArrayBuffer}`);

      window.runMateTest = async (sfen, opts = {}) => {
        const wasmBinary = await fetch("/dist/yaneuraou.wasm").then((r) =>
          r.arrayBuffer(),
        );
        const engine = await createMateEngine({
          factory: YaneuraOuFactory,
          wasmBinary,
          mainScriptUrlOrBlob: new URL("/dist/yaneuraou.js", location.origin).href,
          usiHash: opts.usiHash ?? 1,
          threads: opts.threads ?? 1,
        });
        const result = await engine.solve({
          sfen,
          byoyomi: opts.byoyomi ?? 0,
          nodesLimit: opts.nodesLimit ?? 0,
        });
        engine.dispose();
        return result;
      };

      window.dispatchEvent(new Event("ready"));
    </script>
  </body>
</html>
