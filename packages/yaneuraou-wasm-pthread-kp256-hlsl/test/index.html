<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>yaneuraou-wasm-pthread-kp256 test</title>
  </head>
  <body>
    <h1>yaneuraou-wasm-pthread-kp256 test</h1>
    <pre id="log"></pre>
    <script type="module">
      import YaneuraOuFactory from "/dist/yaneuraou.js";

      const log = (msg) => {
        document.getElementById("log").textContent += msg + "\n";
        console.log(msg);
      };

      log(`crossOriginIsolated=${self.crossOriginIsolated}`);
      log(`SharedArrayBuffer=${typeof SharedArrayBuffer}`);

      // Smoke test: instantiate the WASM module, run the USI handshake, and
      // collect the engine's `usi` reply (id name, options). This proves the
      // pthread workers spawn and the binary boots; eval-dependent commands
      // are exercised by downstream consumers that supply an `nn.bin`.
      window.runSmokeTest = async () => {
        const wasmBinary = await fetch("/dist/yaneuraou.wasm").then((r) =>
          r.arrayBuffer(),
        );
        const lines = [];
        const instance = await YaneuraOuFactory({
          wasmBinary,
          mainScriptUrlOrBlob: new URL("/dist/yaneuraou.js", location.origin).href,
        });
        instance.addMessageListener((line) => lines.push(line));

        instance.postMessage("usi");

        const start = Date.now();
        while (!lines.includes("usiok")) {
          if (Date.now() - start > 15_000) {
            throw new Error(`usi -> usiok timeout. lines: ${lines.length}`);
          }
          await new Promise((r) => setTimeout(r, 1));
        }

        const idName = lines.find((l) => l.startsWith("id name")) ?? null;
        const optionCount = lines.filter((l) => l.startsWith("option ")).length;

        instance.terminate();
        return { ok: true, idName, optionCount, totalLines: lines.length };
      };

      window.dispatchEvent(new Event("ready"));
    </script>
  </body>
</html>
